services:
  # Task 1 — Knowledge Brain (FastAPI)
  - type: web
    name: knowledge-brain
    runtime: python
    rootDir: task1-knowledge-brain
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-tech-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

  # Task 2 — Inbox Agent (Node.js/Fastify)
  - type: web
    name: inbox-agent
    runtime: node
    rootDir: task2-inbox-agent
    buildCommand: npm install && npm run build
    startCommand: node dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLASSIFIER
        value: rules
      # Task 1 is a sibling service in this blueprint; RENDER_EXTERNAL_URL is
      # injected by Render as "https://knowledge-brain.onrender.com".
      - key: KNOWLEDGE_BRAIN_URL
        fromService:
          name: knowledge-brain
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Bind all interfaces. If unset the server probes "::" then "0.0.0.0".
      - key: HOST
        value: 0.0.0.0
      # Render terminates TLS at its edge; needed for correct client IPs.
      - key: TRUST_PROXY
        value: "true"
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-tech-db
          property: connectionString
      - key: DATABASE_SCHEMA
        value: inbox_agent
      - key: EMAIL_DATASET_PATH
        value: datasets/emails-sample.json
      - key: MAX_CONSECUTIVE_UNEDITED_APPROVALS
        value: "20"
      # Comma-separated origins of the deployed frontend (Vercel). Wildcards are
      # supported, e.g. https://*.vercel.app. Localhost is always allowed.
      - key: ALLOWED_ORIGINS
        sync: false

  # Task 3 — Meeting-to-Scope (FastAPI)
  - type: web
    name: meeting-to-scope
    runtime: python
    rootDir: task3-meeting-to-scope
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: KNOWLEDGE_BRAIN_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-tech-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: ai-tech-db
    databaseName: knowledge_brain
    plan: free
